name: Feature request
description: Propose a bounded improvement that preserves the project boundary.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Proposals must preserve the synthetic-only, offline, input-read-only boundary unless a
        separate design and security review explicitly changes it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What maintainer or user need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest observable behavior that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: boundary
    attributes:
      label: Boundary and risk impact
      description: Note any effect on schemas, rules, reports, privacy, dependencies, determinism, or filesystem behavior.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Scope confirmations
      options:
        - label: The proposal does not require real, employer, customer, or credential data.
          required: true
        - label: I reviewed the product boundary and searched existing issues.
          required: true
